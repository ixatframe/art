    <script> 
var WIDTH;
var HEIGHT;
var canvas;
var con;
var g;
var pxs = new Array();
var rint = 50;

$(document).ready(function(){
  WIDTH = window.innerWidth;
  HEIGHT = window.innerHeight;
    $('#container').width(WIDTH).height(HEIGHT);
    canvas = document.getElementById('pixie');
    $(canvas).attr('width', WIDTH).attr('height',HEIGHT);
    con = canvas.getContext('2d');
    for(var i = 0; i < 50; i++) {
        pxs[i] = new Circle();
        pxs[i].reset();
    }
    setInterval(draw,rint);
    setInterval(draw,rint2);

});

function draw() {
    con.clearRect(0,0,WIDTH,HEIGHT);
    for(var i = 0; i < pxs.length; i++) {
        pxs[i].fade();
        pxs[i].move();
        pxs[i].draw();
    }
}

function Circle() {
    this.s = {ttl:8000, xmax:5, ymax:2, rmax:10, rt:1, xdef:960, ydef:540, xdrift:4, ydrift: 4, random:true, blink:true};

    this.reset = function() {
        this.x = (this.s.random ? WIDTH*Math.random() : this.s.xdef);
        this.y = (this.s.random ? HEIGHT*Math.random() : this.s.ydef);
        this.r = ((this.s.rmax-1)*Math.random()) + 1;
        this.dx = (Math.random()*this.s.xmax) * (Math.random() < .5 ? -1 : 1);
        this.dy = (Math.random()*this.s.ymax) * (Math.random() < .5 ? -1 : 1);
        this.hl = (this.s.ttl/rint)*(this.r/this.s.rmax);
        this.rt = Math.random()*this.hl;
        this.s.rt = Math.random()+1;
        this.stop = Math.random()*.2+.4;
        this.s.xdrift *= Math.random() * (Math.random() < .5 ? -1 : 1);
        this.s.ydrift *= Math.random() * (Math.random() < .5 ? -1 : 1);
    }

    this.fade = function() {
        this.rt += this.s.rt;
    }

    this.draw = function() {
        if(this.s.blink && (this.rt <= 0 || this.rt >= this.hl)) this.s.rt = this.s.rt*-1;
        else if(this.rt >= this.hl) this.reset();
        var newo = 1-(this.rt/this.hl);
        con.beginPath();
        con.arc(this.x,this.y,this.r,0,Math.PI*2,true);
        con.closePath();
        var cr = this.r*newo;
        g = con.createRadialGradient(this.x,this.y,0,this.x,this.y,(cr <= 0 ? 1 : cr));
        g.addColorStop(0.0, 'rgba(238,180,28,'+newo+')');
        g.addColorStop(this.stop, 'rgba(238,180,28,'+(newo*.2)+')');
        g.addColorStop(1.0, 'rgba(238,180,28,0)');
        con.fillStyle = g;
        con.fill();
    }

    this.move = function() {
        this.x += (this.rt/this.hl)*this.dx;
        this.y += (this.rt/this.hl)*this.dy;
        if(this.x > WIDTH || this.x < 0) this.dx *= -1;
        if(this.y > HEIGHT || this.y < 0) this.dy *= -1;
    }

    this.getX = function() { return this.x; }
    this.getY = function() { return this.y; }
}

/* iArt Luxury Music Player — compact version */
#iart-music-player{
  position:fixed;
  right:22px;
  bottom:22px;
  z-index:99999;
  display:flex;
  align-items:center;
  pointer-events:none;
  font-family:Rubik,Arial,sans-serif;
}
#iart-music-player .toggle-play{
  pointer-events:auto;
  position:relative;
  width:142px;
  height:48px;
  border:1px solid rgba(232,232,232,.22);
  border-radius:18px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  color:#E8E8E8;
  background:
    linear-gradient(135deg,rgba(255,255,255,.10),rgba(152,152,189,.13)),
    rgba(28,27,37,.58);
  backdrop-filter:blur(16px) saturate(125%);
  -webkit-backdrop-filter:blur(16px) saturate(125%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.15),
    inset 0 -1px 0 rgba(0,0,0,.18),
    0 8px 25px rgba(0,0,0,.30),
    0 0 20px rgba(152,152,189,.14);
  transition:transform .25s ease,box-shadow .3s ease,border-color .3s ease;
  overflow:hidden;
}
#iart-music-player .toggle-play:hover{
  transform:translateY(-2px);
  border-color:rgba(199,199,199,.38);

    0 12px 30px rgba(0,0,0,.34),

#iart-music-player #sound{

  line-height:1;

  text-shadow:0 1px 7px rgba(152,152,189,.45);

.iart-equalizer{

  align-items:flex-end;
  gap:3px;

.iart-equalizer i{

  from{height:5px}
  to{height:19px}

.iart-player-ring{

  inset:5px;
  border:1px solid rgba(152,152,189,.32);
  border-radius:14px;
  opacity:0;
  pointer-events:none;

(function () {

        e.preventDefault();
        return false;
    });

    // Dezactivează Select All

            e.preventDefault();
            return false;
        }

    // Dezactivează selectarea textului
    document.addEventListener("selectstart", function (e) {
        e.preventDefault();
        return false;
    });
})();

<script id="iart-music-player-controller">
(function(){
  const player=document.getElementById("iart-music-player");
  const button=document.getElementById("iart-play-btn");
  const audio=document.getElementById("iart-audio");
  const icon=document.getElementById("sound");
  if(!player||!button||!audio)return;
  function setPlaying(on){player.classList.toggle("playing",on);if(icon) icon.textContent="";}
  button.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();if(audio.paused){audio.play().then(()=>setPlaying(true)).catch(()=>{});}else{audio.pause();setPlaying(false);}});
  audio.addEventListener("play",()=>setPlaying(true));
  audio.addEventListener("pause",()=>setPlaying(false));
  audio.addEventListener("ended",()=>setPlaying(false));
  audio.play().then(()=>setPlaying(true)).catch(()=>{});
})();
</script>
